<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Founders Club Mallorca Logo</title>
  <desc id="desc">FC monogram with Founders Club Mallorca text on dark background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3dba2"/>
      <stop offset="100%" stop-color="#c49a4f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- subtle diagonal texture -->
  <g opacity="0.08">
    <rect x="-200" y="140" width="1800" height="20" transform="rotate(-35 600 600)" fill="#ffffff"/>
    <rect x="-200" y="340" width="1800" height="20" transform="rotate(-35 600 600)" fill="#ffffff"/>
    <rect x="-200" y="540" width="1800" height="20" transform="rotate(-35 600 600)" fill="#ffffff"/>
    <rect x="-200" y="740" width="1800" height="20" transform="rotate(-35 600 600)" fill="#ffffff"/>
    <rect x="-200" y="940" width="1800" height="20" transform="rotate(-35 600 600)" fill="#ffffff"/>
  </g>

  <!-- Monogram -->
  <text x="455" y="480" fill="url(#gold)" font-size="260" font-family="Georgia, 'Times New Roman', serif" font-weight="700">F</text>
  <text x="560" y="520" fill="url(#gold)" font-size="260" font-family="Georgia, 'Times New Roman', serif" font-weight="700">C</text>

  <!-- Brand text -->
  <text x="600" y="675" text-anchor="middle" fill="#ffffff" font-size="94" font-family="Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="2">FOUNDERS CLUB</text>

  <!-- divider -->
  <line x1="250" y1="715" x2="470" y2="715" stroke="#c49a4f" stroke-width="4"/>
  <text x="600" y="735" text-anchor="middle" fill="url(#gold)" font-size="68" font-family="Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="2">Mallorca</text>
  <line x1="730" y1="715" x2="950" y2="715" stroke="#c49a4f" stroke-width="4"/>

  <!-- soft glow -->
  <circle cx="600" cy="600" r="260" fill="#ffffff" opacity="0.03" filter="url(#soft)"/>
</svg>
